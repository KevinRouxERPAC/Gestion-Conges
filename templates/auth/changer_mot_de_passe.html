{% extends "base.html" %}
{% block title %}Changer mon mot de passe{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4">
    <div class="erp-card w-full max-w-md p-8">
        <div class="text-center mb-8">
            <h1 class="erp-h2">Changer mon mot de passe</h1>
            <p class="erp-hint mt-2">{{ current_user.prenom }} {{ current_user.nom }}</p>
        </div>

        <form method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label for="mot_de_passe_actuel" class="erp-label">Mot de passe actuel</label>
                <input type="password" id="mot_de_passe_actuel" name="mot_de_passe_actuel" required autofocus autocomplete="current-password"
                       class="erp-input"
                       placeholder="Votre mot de passe actuel">
            </div>

            <div>
                <label for="nouveau_mot_de_passe" class="erp-label">Nouveau mot de passe</label>
                <input type="password" id="nouveau_mot_de_passe" name="nouveau_mot_de_passe" required minlength="8" autocomplete="new-password"
                       class="erp-input"
                       placeholder="Au moins 8 caractères">
                <p class="erp-hint mt-1">8 caractères minimum.</p>
            </div>

            <div>
                <label for="confirmation_mot_de_passe" class="erp-label">Confirmer le nouveau mot de passe</label>
                <input type="password" id="confirmation_mot_de_passe" name="confirmation_mot_de_passe" required minlength="8" autocomplete="new-password"
                       class="erp-input"
                       placeholder="Retapez le nouveau mot de passe">
            </div>

            <button type="submit"
                    class="erp-btn erp-btn--primary erp-btn--block">
                Mettre à jour
            </button>
        </form>
    </div>
</div>
{% endblock %}
